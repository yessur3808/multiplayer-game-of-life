services:
  server:
    build:
      context: ./server
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      BOARD_WIDTH: ${BOARD_WIDTH:-80}
      BOARD_HEIGHT: ${BOARD_HEIGHT:-50}
      SIMULATION_INTERVAL_MS: ${SIMULATION_INTERVAL_MS:-1000}
    restart: unless-stopped

  client:
    build:
      context: ./client
    depends_on:
      - server
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped

